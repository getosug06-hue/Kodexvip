<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Архив Юристов — Закрытый образовательный портал</title>

  <link rel="stylesheet" href="./tailwind.css">
  <script src="./supabase.min.js"></script>
  <script src="./lucide.min.js"></script>
  <script src="./pdf.min.js"></script>

  <style>
    :root {
      --bg-main: #0a0a0c;
      --bg-card: #121216;
      --bg-input: #18181f;
      --gold: #c5a880;
      --gold-hover: #dfbe91;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --border-gold: rgba(197, 168, 128, 0.15);
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Playfair Display', serif;
    }
    .archive-root {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .archive-root::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(197,168,128,0.05) 0%, transparent 50%),
                  linear-gradient(rgba(255,255,255,0.005) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(255,255,255,0.005) 1px, transparent 1px);
      background-size: 100% 100%, 50px 50px, 50px 50px;
      z-index: 1;
      pointer-events: none;
    }
    .gold-glow { position: fixed; left: -10%; right: -10%; bottom: -10%; height: 60vh; background: radial-gradient(ellipse at center bottom, rgba(223,190,145,0.55) 0%, rgba(197,168,128,0.28) 30%, rgba(197,168,128,0.10) 55%, transparent 75%); filter: blur(10px); transform: translateY(35%) scaleY(0.6); pointer-events: none; z-index: 0; animation: goldGlowRise 9s ease-in-out infinite; }
    @keyframes goldGlowRise { 0%, 100% {opacity:0;transform:translateY(35%) scaleY(0.6);} 30%{opacity:0.9;transform:translateY(0%) scaleY(1.05);} 65%{opacity:0.75;transform:translateY(-2%) scaleY(1);} }
    .sparks { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .spark { position: absolute; left: var(--left); bottom: -5%; width: var(--size); height: var(--size); border-radius: 50%; background: radial-gradient(circle, #fffdf5 0%, #f4d79f 35%, var(--gold) 58%, rgba(197,168,128,0) 78%); box-shadow: 0 0 10px 3px rgba(223,190,145,0.82); opacity: 0; animation: sparkRise var(--duration) ease-in-out infinite; animation-delay: var(--delay); filter: brightness(1.25); }
    @keyframes sparkRise { 0%{transform:translate(0,0) scale(0.5);opacity:0;} 8%{opacity:0.9;} 100%{transform:translate(var(--drift),-80vh) scale(0.3);opacity:0;} }

    .viewer-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(8px); }
    .viewer-content { background: var(--bg-card); border: 1px solid var(--border-gold); width: 100%; max-width: 1000px; height: 85vh; border-radius: 8px; display: flex; flex-direction: column; }
    .viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-b: 1px solid var(--border-gold); }
    .viewer-body { flex-grow: 1; background: #000; position: relative; overflow: auto; }
    .pdf-page-shell { position: relative; width: max-content; max-width: 100%; margin: 0 auto 18px; }
    .pdf-page-shell canvas { display: block; max-width: 100%; height: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.55); }
    .pdf-page-watermarks { position: absolute; inset: 0; pointer-events: none; user-select: none; z-index: 2; }
    .pdf-page-watermark { position: absolute; color: rgba(223,190,145,0.42); font-size: 15px; font-weight: 700; letter-spacing: 0.035em; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,0.72), 0 0 6px rgba(255,246,230,0.18); }
    .pdf-page-watermark.top-left { top: 16px; left: 18px; transform: rotate(-14deg); }
    .pdf-page-watermark.center { top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-24deg); color: rgba(223,190,145,0.30); }
    .pdf-page-watermark.bottom-right { right: 18px; bottom: 16px; transform: rotate(-14deg); }
    .viewer-body iframe { width: 100%; height: 100%; border: none; }
    .viewer-watermark { position: absolute; inset: 0; pointer-events: none; z-index: 5; display: flex; flex-wrap: wrap; gap: 60px; align-content: center; justify-content: center; opacity: 0.10; color: var(--gold); font-size: 1.1rem; font-weight: 600; transform: rotate(-28deg); overflow: hidden; user-select: none; }
    .screenshot-warning { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,74,74,0.95); color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; z-index: 150; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 30px rgba(255,74,74,0.4); }
    .favorite-toggle-btn { transition: transform 0.18s ease, color 0.18s ease, filter 0.18s ease; }
    .favorite-toggle-btn.favorite-pop { animation: favoritePop 0.5s ease both; }
    @keyframes favoritePop { 0% { transform: scale(1); } 35% { transform: scale(1.55) rotate(-8deg); filter: drop-shadow(0 0 10px rgba(223,190,145,0.9)); } 70% { transform: scale(0.88) rotate(5deg); } 100% { transform: scale(1); } }
    .favorite-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(15px); opacity: 0; z-index: 210; pointer-events: none; background: rgba(18,18,22,0.96); border: 1px solid rgba(197,168,128,0.65); color: #dfbe91; border-radius: 999px; padding: 10px 18px; font-size: 0.85rem; box-shadow: 0 8px 30px rgba(0,0,0,0.45); transition: opacity 0.2s ease, transform 0.2s ease; }
    .favorite-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .cursor-trail-dot { position: fixed; width: var(--trail-size); height: var(--trail-size); left: 0; top: 0; border-radius: 50%; pointer-events: none; z-index: 180; background: radial-gradient(circle, rgba(255,246,230,0.95) 0%, rgba(223,190,145,0.72) 38%, rgba(197,168,128,0) 75%); box-shadow: 0 0 12px 3px rgba(223,190,145,0.45); transform: translate(-50%, -50%); animation: cursorTrailFade 0.75s ease-out forwards; }
    @keyframes cursorTrailFade { from { opacity: 0.9; transform: translate(-50%, -50%) scale(1); } to { opacity: 0; transform: translate(-50%, -50%) scale(0.15); } }
    body.login-transition::before { content: ''; position: fixed; inset: 0; z-index: 200; pointer-events: none; background: radial-gradient(circle at center, rgba(223,190,145,0.72), rgba(197,168,128,0.22) 28%, rgba(10,10,12,0.96) 72%); opacity: 0; animation: loginFlash 1.35s ease both; }
    body.login-transition::after { content: 'Доступ подтверждён'; position: fixed; left: 50%; top: 50%; z-index: 201; transform: translate(-50%, -50%) scale(0.92); color: #fff6e6; font-family: 'Playfair Display', serif; font-size: clamp(1.2rem, 4vw, 2.2rem); letter-spacing: 0.08em; opacity: 0; text-shadow: 0 0 22px rgba(255,246,230,0.8); animation: loginText 1.35s ease both; pointer-events: none; }
    @keyframes loginFlash { 0%, 58% { opacity: 0; transform: scale(0.86); } 72% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.18); } }
    @keyframes loginText { 0%, 14% { opacity: 0; transform: translate(-50%, -50%) scale(0.92); } 30%, 60% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 78%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); } }
    .login-spinner { width: 15px; height: 15px; border: 2px solid rgba(0,0,0,0.28); border-top-color: #000; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.events-mode { background: #0a090d; }
    body.events-mode .gold-glow, body.events-mode .sparks, body.events-mode > .cursor-trail-dot { display: none; }
    .events-nav-launch { position: relative; overflow: hidden; }
    .events-nav-launch::before, .events-nav-launch::after { content: ''; position: absolute; left: -20%; right: -20%; height: 1px; background: #a76aff; opacity: 0; pointer-events: none; }
    .events-nav-launch::before { top: 35%; }.events-nav-launch::after { top: 68%; background: #d895c4; }
    .events-nav-launch:hover, .events-nav-launch:focus-visible { color: #f1e8ff !important; border-color: #9c6cff !important; box-shadow: 0 0 20px rgba(156,108,255,.2), inset 0 0 18px rgba(156,108,255,.08); }
    .events-nav-launch:hover::before { opacity: .9; animation: navGlitch .32s steps(2, end) infinite; }.events-nav-launch:hover::after { opacity: .75; animation: navGlitch .22s steps(2, end) infinite reverse; }
    @keyframes navGlitch { 0% { transform: translateX(-7%); } 50% { transform: translateX(11%) scaleX(.72); } 100% { transform: translateX(-3%); } }
    .events-page { --violet: #9c6cff; --violet-bright: #c7a9ff; --brown: #af9996; --ink: #0a090d; min-height: 100vh; color: #e7dfe5; background: radial-gradient(circle at 70% 11%, rgba(124,75,185,.13), transparent 24%), #0a090d; font-family: 'Montserrat', sans-serif; letter-spacing: .01em; }
    .events-page button, .events-page select { font: inherit; }
    .events-page-header { max-width: 1420px; margin: 0 auto; min-height: 80px; padding: 20px 34px; display: flex; align-items: center; gap: 28px; border-bottom: 1px solid rgba(196,170,195,.14); position: relative; z-index: 3; }
    .events-page-header::before, .events-page-footer::before { content: ''; position: absolute; left: 24px; top: 21px; width: 16px; height: 16px; border-left: 1px solid rgba(199,169,255,.7); border-top: 1px solid rgba(199,169,255,.7); }
    .events-brand { display: flex; align-items: center; gap: 11px; color: #f2e8e8; text-align: left; background: none; border: 0; cursor: pointer; min-width: 205px; }
    .events-brand-mark { display: grid; place-items: center; width: 31px; height: 31px; color: var(--violet-bright); border: 1px solid rgba(199,169,255,.55); font-size: 17px; }
    .events-brand strong { display: block; font-family: 'Playfair Display', serif; font-size: 15px; letter-spacing: .13em; font-weight: 500; }
    .events-brand small { display: block; margin-top: 3px; color: #8e838d; font-size: 9px; letter-spacing: .12em; }
    .events-nav { display: flex; justify-content: center; gap: 26px; flex: 1; }
    .events-nav button { position: relative; padding: 9px 0; color: #988f9d; background: none; border: 0; cursor: pointer; font-size: 11px; }
    .events-nav button:hover, .events-nav button.active { color: #efe6ed; }
    .events-nav button.active::after { content: ''; position: absolute; bottom: -18px; left: 0; right: 0; height: 1px; background: var(--violet); box-shadow: 0 0 11px var(--violet); }
    .events-page-actions { display: flex; align-items: center; gap: 10px; }
    .events-page-icon { position: relative; display: grid; place-items: center; width: 32px; height: 32px; color: #bcaec4; background: rgba(255,255,255,.02); border: 1px solid rgba(197,173,198,.2); cursor: pointer; }
    .events-page-icon svg { width: 14px; height: 14px; }
    .page-badge { position: absolute; top: -6px; right: -6px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 99px; color: #07060a; font-size: 8px; line-height: 14px; font-weight: 700; text-align: center; }
    .page-badge.red { background: #e26370; }.page-badge.yellow { background: #dfbe91; }
    .events-contact-link { padding: 9px 14px; color: #d9cbd4; background: transparent; border: 1px solid rgba(200,185,205,.45); cursor: pointer; font-size: 10px; }
    .events-page-main { max-width: 1420px; margin: 0 auto; padding: 0 24px 28px; }
    .events-hero { position: relative; display: grid; grid-template-columns: 47% 53%; min-height: 445px; overflow: hidden; border-bottom: 1px solid rgba(194,175,195,.22); }
    .events-hero-copy { position: relative; z-index: 2; padding: 62px 36px 35px 58px; background: linear-gradient(90deg, rgba(10,9,13,1) 0%, rgba(10,9,13,.97) 66%, rgba(10,9,13,.15) 100%); }
    .events-overline { display: flex; justify-content: space-between; max-width: 500px; color: #ab9baa; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; }
    .events-code { color: var(--violet); }
    .events-script { margin: 25px 0 -12px 20px; color: var(--violet-bright); font-family: 'Playfair Display', serif; font-size: 35px; font-style: italic; letter-spacing: .08em; transform: rotate(-7deg); text-shadow: 8px 0 0 rgba(154,104,255,.18); }
    .events-glitch-title { position: relative; display: inline-block; margin: 0; color: #e9dfe2; font-family: 'Playfair Display', serif; font-size: clamp(60px, 8.5vw, 126px); font-weight: 500; line-height: .9; letter-spacing: -.08em; text-shadow: 0 0 25px rgba(199,169,255,.12); }
    .events-glitch-title::before, .events-glitch-title::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    .events-glitch-title::before { color: #a56eff; transform: translate(4px, -2px); clip-path: inset(12% 0 64% 0); }.events-glitch-title::after { color: #d88fbc; transform: translate(-3px, 2px); clip-path: inset(68% 0 8% 0); }
    .events-hero-copy p { max-width: 390px; margin: 26px 0 26px 4px; color: #b2a6b0; font-size: 13px; line-height: 1.8; }
    .events-hero-cta { display: flex; align-items: center; justify-content: space-between; width: 235px; padding: 13px 16px; color: #dfd3de; background: transparent; border: 1px solid rgba(185,157,215,.35); cursor: pointer; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
    .events-hero-cta:hover { border-color: var(--violet); color: #fff; box-shadow: 0 0 22px rgba(156,108,255,.13); }.events-hero-cta span { color: var(--violet-bright); font-size: 17px; }
    .events-hero-signature { display: flex; align-items: center; gap: 28px; margin-top: 50px; color: #786c76; font-size: 9px; letter-spacing: .2em; }.events-hero-signature b { color: var(--violet-bright); font-weight: 500; }
    .events-hero-visual { position: relative; min-height: 445px; overflow: hidden; background: radial-gradient(ellipse at 55% 52%, rgba(118,77,147,.42), transparent 44%), linear-gradient(115deg, #151016, #382639 48%, #0d0b10); }
    .events-hero-visual::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 44px, rgba(204,165,255,.05) 45px, transparent 46px), repeating-linear-gradient(0deg, transparent 0 38px, rgba(204,165,255,.045) 39px, transparent 40px); mix-blend-mode: screen; }
    .hero-glitch-grid { position: absolute; inset: 14% 12% 12% 3%; opacity: .55; background: linear-gradient(90deg, transparent 0 20%, rgba(202,168,255,.5) 20.2% 20.7%, transparent 21% 48%, rgba(204,165,255,.4) 48.2% 48.6%, transparent 49%), linear-gradient(0deg, transparent 0 31%, rgba(235,188,218,.5) 31.3% 31.8%, transparent 32% 67%, rgba(170,132,255,.55) 67.2% 67.8%, transparent 68%); filter: blur(.2px); }
    .hero-scale { position: absolute; left: 14%; top: 10%; color: rgba(223,203,223,.65); font-size: clamp(170px, 28vw, 360px); line-height: 1; font-family: serif; transform: rotate(-4deg); filter: drop-shadow(0 0 18px rgba(156,108,255,.4)); opacity: .68; }
    .hero-scale::after { content: '⚖'; position: absolute; left: 19px; top: 8px; color: transparent; -webkit-text-stroke: 1px rgba(166,117,245,.9); transform: translate(8px, -4px); clip-path: inset(0 0 48% 0); }
    .hero-noise { position: absolute; inset: 0; opacity: .13; background-image: repeating-linear-gradient(0deg, transparent 0 3px, #fff 4px, transparent 5px); mix-blend-mode: overlay; }.hero-vertical-code { position: absolute; right: 9%; top: 25%; color: rgba(221,194,226,.58); font-size: 9px; line-height: 2.1; letter-spacing: .2em; }.hero-scan-line { position: absolute; left: 0; right: 0; top: 41%; height: 1px; background: linear-gradient(90deg, transparent, rgba(227,186,255,.8), transparent); box-shadow: 0 0 12px rgba(156,108,255,.8); animation: heroScan 5s ease-in-out infinite; }
    @keyframes heroScan { 0%,100% { transform: translateY(-130px); opacity: 0; } 30%,65% { opacity: .8; } 82% { transform: translateY(145px); opacity: 0; } }
    .events-filter-strip { display: flex; align-items: center; gap: 0; min-height: 60px; border-bottom: 1px solid rgba(194,175,195,.2); overflow-x: auto; }.events-filter-symbol { color: var(--violet); padding: 0 15px 0 7px; font-size: 18px; }.events-filter-tab { align-self: stretch; padding: 0 18px; color: #938692; white-space: nowrap; background: transparent; border: 0; border-left: 1px solid rgba(194,175,195,.1); cursor: pointer; font-size: 10px; }.events-filter-tab:hover, .events-filter-tab.active { color: #f0e6ef; background: rgba(156,108,255,.07); box-shadow: inset 0 -2px var(--violet); }.events-filter-spacer { flex: 1; }.events-filter-sort-label { color: #746873; white-space: nowrap; font-size: 9px; }.events-sort-select { margin-left: 8px; padding: 8px 10px; color: #d1c4d1; background: #121016; border: 1px solid rgba(194,175,195,.2); font-size: 9px; }

    function addMonthsClamped(date, months) {
      const initialDay = date.getDate();
      date.setDate(1);
      date.setMonth(date.getMonth() + months);
      const lastDayOfTargetMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      date.setDate(Math.min(initialDay, lastDayOfTargetMonth));
      return date;
    }

    function calculateExpiryDateFromBase(baseDate, duration) {
      const expiryDate = new Date(baseDate);
      if (duration === '14-days') expiryDate.setDate(expiryDate.getDate() + 14);
      else if (duration === 'month') addMonthsClamped(expiryDate, 1);
      else if (duration === '3-months') addMonthsClamped(expiryDate, 3);
      else if (duration === '6-months') addMonthsClamped(expiryDate, 6);
      else if (duration === 'year') addMonthsClamped(expiryDate, 12);
      else throw new Error('Неизвестный срок доступа.');
      return expiryDate;
    }

    function calculateExpiryDate(duration) {
      return calculateExpiryDateFromBase(new Date(), duration);
    }

    function calculateRenewedExpiryDate(currentExpiresAt, duration) {
      const today = new Date();
      const currentExpiry = currentExpiresAt
        ? new Date(`${String(currentExpiresAt).slice(0, 10)}T12:00:00`)
        : today;
      const baseDate = currentExpiry > today ? currentExpiry : today;
      return calculateExpiryDateFromBase(baseDate, duration);
    }

    function toLocalDateValue(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function isKeyExpired(expiresAt) {
      if (!expiresAt) return false;
      return String(expiresAt).slice(0, 10) < toLocalDateValue(new Date());
    }

    function getAdminPage(items, listName) {
      const source = Array.isArray(items) ? items : [];

      return { rows: source.slice(start, start + ADMIN_PAGE_SIZE), page: adminPages[listName], totalPages };

    function getLectureTimestamp(lecture) {
      if (lecture?.created_at) {
        const timestamp = new Date(lecture.created_at).getTime();
        if (Number.isFinite(timestamp)) return timestamp;
      }
      const parts = String(lecture?.date || '').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
      if (parts) return new Date(Number(parts[3]), Number(parts[2]) - 1, Number(parts[1])).getTime();
      return 0;
    }

    function sortLectures(lectures, order) {
      return [...lectures].sort((a, b) => {
        const difference = getLectureTimestamp(a) - getLectureTimestamp(b);
        return order === 'oldest' ? difference : -difference;
      });
    }

      const profileCreatedAt = currentStudent?.created_at ? new Date(currentStudent.created_at).getTime() : 0;
      return lectures.filter(lecture => {
        const lectureTime = getLectureTimestamp(lecture);
        return lectureTime > profileCreatedAt && !readIds.has(String(lecture.id));
      }).sort((a, b) => getLectureTimestamp(b) - getLectureTimestamp(a));
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }

      if (/failed to fetch|network|networkerror/i.test(message)) return 'Не удалось связаться с хранилищем. Проверьте соединение и повторите попытку.';
      return message;

    async function uploadRegistrationPdf(registrationId, file) {
      if (!isPdfFile(file)) throw new Error('Для результата можно загрузить только PDF-файл.');
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `events/${registrationId}/${Date.now()}-${safeName}`;
      const upload = await withTimeout(_supabase.storage.from('event-results').upload(path, file, {
        upsert: false,
        cacheControl: '3600',
        contentType: 'application/pdf'
      }), 30000);
      if (upload.error) throw upload.error;
      const { data } = _supabase.storage.from('event-results').getPublicUrl(path);
      if (!data?.publicUrl) throw new Error('Не удалось получить ссылку на загруженный PDF.');
      return { path, publicUrl: data.publicUrl, name: file.name };
    }

    function normalizeDocumentLink(link) {
      try {
        const url = new URL(link, window.location.href);
        if (url.hostname.endsWith('.supabase.co') && url.pathname.includes('/storage/v1/object/')) {
          url.searchParams.set('download', '0');
        }
        return url.toString();
      } catch { return link; }
    }

    function getWatermarkText() {
      return currentStudent?.student_name || 'Администратор';
    }

    function createPageWatermark(text) {
      const layer = document.createElement('div');
      layer.className = 'pdf-page-watermarks';
      [['top-left', text], ['center', text], ['bottom-right', text]].forEach(([position, value]) => {
        const watermark = document.createElement('div');
        watermark.className = `pdf-page-watermark ${position}`;
        watermark.textContent = value;
        layer.appendChild(watermark);
      });
      return layer;
    }

    async function renderPdfInline(pdfUrl) {
      const area = document.getElementById('pdf-pages');
      if (!area) return;
      if (!window.pdfjsLib) {
        area.innerHTML = '<div class="p-6 text-red-300">Не удалось загрузить просмотрщик PDF. Используйте «Открыть отдельно».</div>';
        return;
      }
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';
        const pdf = await window.pdfjsLib.getDocument({ url: pdfUrl, withCredentials: false }).promise;
        const status = document.createElement('div');
        status.className = 'text-center text-xs text-gray-400 pb-3';
        status.textContent = `Страница 1 из ${pdf.numPages} загружается…`;
        area.innerHTML = '';
        area.appendChild(status);
        const watermarkText = getWatermarkText();
        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          const page = await pdf.getPage(pageNumber);
          const rawViewport = page.getViewport({ scale: 1 });
          const availableWidth = Math.max(320, Math.min(area.clientWidth - 32, 900));
          const scale = Math.min(1.35, availableWidth / rawViewport.width);
          const viewport = page.getViewport({ scale });
          const pageShell = document.createElement('div');
          pageShell.className = 'pdf-page-shell';
          const canvas = document.createElement('canvas');
          canvas.className = 'block mx-auto shadow-xl max-w-full';
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          pageShell.appendChild(canvas);
          pageShell.appendChild(createPageWatermark(watermarkText));
          area.appendChild(pageShell);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
          status.textContent = `Страница ${pageNumber} из ${pdf.numPages}`;
          await new Promise(resolve => requestAnimationFrame(resolve));
        }
      } catch (error) {
        console.error('Ошибка просмотра PDF:', error);
        area.innerHTML = '<div class="p-6 text-red-300">Этот файл нельзя показать внутри сайта. Проверьте, что ссылка публичная и ведёт на PDF, либо используйте «Открыть отдельно».</div>';
      }
    }

    function openDocumentSeparately(url, title, watermarkText, isPdf) {
      if (!isPdf) {
        const tab = window.open(url, '_blank', 'noopener,noreferrer');
        if (!tab) window.location.assign(url);
        return;
      }
      const tab = window.open('', '_blank');
      if (!tab) {
        window.location.assign(url);
        return;
      }
      const safeUrl = JSON.stringify(url);
      const safeTitle = JSON.stringify(title || 'Документ');
      const safeWatermark = JSON.stringify(watermarkText || 'Архив Юристов');
      tab.document.open();
      tab.document.write(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title || 'Документ'}</title><style>
        :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#202020;color:#ddd;font-family:Arial,sans-serif}.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;background:#111;border-bottom:1px solid #6f5a3b}.bar strong{color:#dfbe91}.bar button{padding:7px 11px;color:#dfbe91;background:transparent;border:1px solid #6f5a3b;border-radius:4px;cursor:pointer}.pages{padding:16px}.status{text-align:center;margin:0 0 12px;color:#aaa;font-size:12px}.shell{position:relative;width:max-content;max-width:100%;margin:0 auto 18px}.shell canvas{display:block;max-width:100%;height:auto;box-shadow:0 4px 20px #000}.marks{position:absolute;inset:0;pointer-events:none;user-select:none;overflow:hidden}.mark{position:absolute;color:rgba(223,190,145,.42);font-size:15px;font-weight:700;letter-spacing:.035em;text-shadow:0 1px 3px rgba(0,0,0,.72),0 0 6px rgba(255,246,230,.18);white-space:nowrap}.mark.tl{top:16px;left:18px;transform:rotate(-14deg)}.mark.cc{top:50%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);color:rgba(223,190,145,.30)}.mark.br{right:18px;bottom:16px;transform:rotate(-14deg)}.error{padding:24px;color:#fca5a5}</style></head><body><div class="bar"><strong>${title || 'Документ'}</strong><button onclick="window.close()">Закрыть вкладку</button></div><div id="status" class="status">Документ загружается…</div><div id="pages" class="pages"></div><script src="./pdf.min.js"><\/script><script>(async()=>{const url=${safeUrl};const mark=${safeWatermark};const pdfjsLib=window.pdfjsLib;pdfjsLib.GlobalWorkerOptions.workerSrc='./pdf.worker.min.js';try{const pdf=await pdfjsLib.getDocument({url,withCredentials:false}).promise;const pages=document.getElementById('pages');const status=document.getElementById('status');for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n);const v=p.getViewport({scale:1.35});const shell=document.createElement('div');shell.className='shell';const c=document.createElement('canvas');c.width=v.width;c.height=v.height;shell.appendChild(c);const marks=document.createElement('div');marks.className='marks';[['tl','top-left'],['cc','center'],['br','bottom-right']].forEach(([cls])=>{const m=document.createElement('div');m.className='mark '+cls;m.textContent=mark;marks.appendChild(m)});shell.appendChild(marks);pages.appendChild(shell);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;status.textContent='Страница '+n+' из '+pdf.numPages}}catch(e){document.getElementById('status').textContent='Не удалось открыть PDF';document.getElementById('pages').innerHTML='<div class="error">Проверьте, что ссылка ведёт на доступный PDF-файл.</div>'}})()<\/script></body></html>`);
      tab.document.close();
    }
    function renderViewerModal() {
      if (!activeViewerLecture) return;
      const oldModal = document.getElementById('document-viewer-modal');
      if (oldModal) oldModal.remove();

      const sourceLink = normalizeDocumentLink(activeViewerLecture.link);
      const lowerSourceLink = sourceLink.toLowerCase();
      const isPdf = lowerSourceLink.includes('.pdf') || (activeViewerLecture.title || '').toLowerCase().includes('.pdf');
      const isYandex = lowerSourceLink.includes('disk.yandex');
      const watermarkText = getWatermarkText();
      const documentMarkup = isPdf
        ? '<div id="pdf-pages" class="w-full min-h-full p-4 overflow-auto bg-[#202020]"><div class="p-6 text-gray-400">Первая страница загружается…</div></div>'
        : `<div class="w-full h-full relative"><iframe src="${sourceLink}" title="${activeViewerLecture.title}" allowfullscreen></iframe>${isYandex ? '<div class="absolute inset-0 flex items-center justify-center bg-black/80 p-6 text-center text-gray-300">Яндекс.Диск запрещает встраивание этого файла на сторонние сайты. Нажмите «Открыть отдельно» или используйте публичную PDF-ссылку из Supabase.</div>' : ''}</div>`;

      const modal = document.createElement('div');
      modal.id = 'document-viewer-modal';
      modal.className = 'viewer-modal';
      modal.innerHTML = `
        <div class="viewer-content">
          <div class="viewer-header"><h3 class="text-lg font-bold text-[#c5a880]">${activeViewerLecture.title}</h3><div class="flex items-center gap-3"><button id="viewer-favorite-btn" type="button" class="text-2xl leading-none ${getFavoriteIds().includes(String(activeViewerLecture.id)) ? 'text-[#c5a880]' : 'text-gray-600'}" title="Добавить в избранное" aria-label="Добавить в избранное">♥</button><button id="open-separate-btn" type="button" class="text-xs text-[#c5a880] hover:text-white">Открыть отдельно</button><button id="close-viewer-btn" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button></div></div>
          <div class="viewer-body" id="viewer-body-container">
            ${documentMarkup}
            ${isPdf ? '' : `<div class="viewer-watermark">${watermarkText}</div>`}
          </div>
        </div>
        <div id="screenshot-alert" class="screenshot-warning hidden"><i data-lucide="shield-alert" class="w-[18px] h-[18px]"></i> Скриншоты запрещены!</div>
      `;
      document.body.appendChild(modal);
      if (window.lucide?.createIcons) window.lucide.createIcons();
      if (isPdf) renderPdfInline(sourceLink);

      document.getElementById('viewer-favorite-btn').addEventListener('click', (event) => {
        const button = event.currentTarget;
        const result = toggleFavoriteLecture(activeViewerLecture.id);
        button.classList.toggle('text-[#c5a880]', result.added);
        button.classList.toggle('text-gray-600', !result.added);
        button.title = result.added ? 'Убрать из избранного' : 'Добавить в избранное';
        button.classList.remove('favorite-pop');
        void button.offsetWidth;
        button.classList.add('favorite-pop');
      });
      document.getElementById('open-separate-btn').addEventListener('click', () => openDocumentSeparately(sourceLink, activeViewerLecture.title, watermarkText, isPdf));
      document.getElementById('close-viewer-btn').addEventListener('click', () => { modal.remove(); activeViewerLecture = null; });
    }

    window.addEventListener('keyup', (e) => { if (e.key === 'PrintScreen') { navigator.clipboard?.writeText(''); const a = document.getElementById('screenshot-alert'); if (a) { a.classList.remove('hidden'); setTimeout(() => a.classList.add('hidden'), 2000); } } });
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    // Сначала сразу показываем форму входа. Медленный запрос к Supabase
    // не должен блокировать отображение интерфейса на мобильном интернете.
    renderApp();
    restoreStudentSession().then(restored => {
      // При успешном восстановлении функция сама отрисует профиль.
      // Если профиль не найден, уже показанная форма входа остаётся на месте.
      if (!restored && currentScreen !== 'auth') {
        currentScreen = 'auth';
        currentStudent = null;
        renderApp();
      }
    }).catch(error => {
      console.warn('Не удалось восстановить сессию студента:', error);
    });
  </script>
</body>
</html>
